server.port=8080

# ==========================================
# DATABASE CONFIGURATION (MySQL)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_messenger_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345Ty67?
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# JWT SECURITY CONFIGURATION
# ==========================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Client ID của Google Web OAuth, dùng cùng một giá trị ở frontend.
app.google.client-id=${GOOGLE_CLIENT_ID:}
# SMTP dùng để gửi mã xác minh đăng ký.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:}

# ==========================================
# GOOGLE GEMINI AI CONFIGURATION
# ==========================================
app.gemini.api-key=gen-lang-client-0276273971
app.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.upload-dir=${UPLOAD_DIR:uploads}
